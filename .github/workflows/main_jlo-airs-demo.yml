# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jlo-airs-demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Create .env from secrets
        run: |
          cat > .env << 'EOF'
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          VITE_PORTKEY_BASE_URL=${{ secrets.VITE_PORTKEY_BASE_URL }}
          VITE_PORTKEY_PROVIDER=${{ secrets.VITE_PORTKEY_PROVIDER }}
          VITE_PORTKEY_MODEL=${{ secrets.VITE_PORTKEY_MODEL }}
          VITE_PORTKEY_SCM_REPORT_URL=${{ secrets.VITE_PORTKEY_SCM_REPORT_URL }}
          VITE_DIRECT_BASE_URL=${{ secrets.VITE_DIRECT_BASE_URL }}
          VITE_DIRECT_MODEL=${{ secrets.VITE_DIRECT_MODEL }}
          EOF

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            data/
            server.mjs
            package.json
            package-lock.json
            node_modules/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jlo-airs-demo'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.mjs'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2FFC83EFD7F241B6BA54E815DF64B04D }}
